name: release

# 推 v* 标签即自动打包并发布 Release（参照常见包管理流程：tag = 版本，Release = 发行说明 + 资产）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 校验 tag 与 manifest.yaml 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mf="$(python scripts/build_dist.py --print-version)"
          echo "tag=$tag  manifest=$mf"
          if [ "$tag" != "$mf" ]; then
            echo "::error::tag v$tag 与 manifest.yaml 的版本 $mf 不一致，请先同步版本号"
            exit 1
          fi

      - name: 打包
        run: python scripts/build_dist.py

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 发行说明优先取 README 的「更新日志」对应段落（人工维护、单一数据源）；
          # 取不到才回退到 GitHub 自动生成 —— 本项目无 PR，自动 notes 往往只剩
          # 一行 "Full Changelog"，Release 页面等于没有说明。
          #
          # **范围**：一个 tag 可能涵盖多个版本段（本项目是"改完攒着、验收后一起发"的节奏），
          # 所以用**上一个已发布 tag** 当下界，把所有未发布的版本段一次带出来。
          # 这样不必在 README 里手工维护"本版包含 X~Y"那句话（写了必过期）。
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          echo "上一个已发布 tag：${prev:-（无，按首次发版处理）}"
          notes_ok=0
          if [ -n "$prev" ]; then
            if python scripts/extract_changelog.py "$GITHUB_REF_NAME" --since "$prev" \
                 > /tmp/release-notes.md; then notes_ok=1; fi
          else
            if python scripts/extract_changelog.py "$GITHUB_REF_NAME" \
                 > /tmp/release-notes.md; then notes_ok=1; fi
          fi

          NOTES_ARGS=(--generate-notes)
          if [ "$notes_ok" = "1" ]; then
            bytes="$(wc -c < /tmp/release-notes.md)"
            nver="$(grep -c '^### ' /tmp/release-notes.md || true)"
            echo "发行说明：取自 README 更新日志（${bytes} 字节 / ${nver} 个版本段）"
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          else
            echo "::warning::README 更新日志里没有 $GITHUB_REF_NAME 的段落，回退到自动生成"
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            "${NOTES_ARGS[@]}" \
            dist/workbuddy-credits-v*.zip \
            dist/workbuddy-credits.zip \
            dist/SHA256SUMS.txt
