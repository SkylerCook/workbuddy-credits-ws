name: workbuddy-credits
slug: workbuddy-credits
version: 1.3.0
category: 效率工具
author: Skyler Cook
description: 查询 WorkBuddy/CodeBuddy 积分余额与批次明细，支持每日签到（工作台一键完成，无需打开 WorkBuddy）、请求级消耗明细（含运行时提示词，永不落盘）、包生命周期（有效期内/已过期）、过期浪费分析、余额快照、可视化工作台、双击启动器与桌面/开始菜单快捷方式，并支持从 GitHub Releases 一键更新到最新版本（带 sha256 校验）。
tags:
  - 积分
  - WorkBuddy
  - 签到
  - 效率
  - 可视化
trigger:
  - 我的积分
  - 积分余额
  - 积分明细
  - 签到领积分
  - 积分快过期了
